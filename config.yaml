# =============================================================================
# DEV AGENT CONFIGURATION
# =============================================================================
#
# To add a new repo:
#   1. Pick the right type from repo_types below (or add a new type)
#   2. Add 5 lines under repos:
#
#      example-service:
#        type: sdk-module
#        local_path: /path/to/example-service
#        github_url: https://github.com/your-org/example-service
#        main_branch: main
#
# That's it. The agent inherits all commands and rules from the type.
# Override any field per-repo if needed.
# =============================================================================

# ── Agent Settings ────────────────────────────────────────────────────────────
model: claude-opus-4-6
max_turns: 80

# ── Repo Type Templates ───────────────────────────────────────────────────────
# Define once, reuse across all repos of the same kind.
# Each repo references one of these types.

repo_types:
  sdk-module:
    # Backend product module (Vitest, Node)
    language: TypeScript
    framework: Example SDK
    test_command: npm run test:unit
    typecheck_command: npm run typecheck
    lint_command: npm run lint
    format_check_command: npm run prettier:check
    format_fix_command: npm run prettier:write
    snapshot_reset_command: npm run unsnap
    test_file_pattern: "*.spec.ts colocated next to source"
    path_alias: "@ -> src/, @@ -> project root"
    zod_import: "import z from '@/z'  (never from 'zod' directly)"
    protected_files:
      - src/bundle-tests/chai.d.ts
      - src/bundle-tests/mocha.d.ts
      - src/sdk.d.ts
    autogenerated_dirs:
      - payloads/
      - code/
      - workflows/
      - .sdk-config.json

  nextjs-portal:
    # Next.js 14 App Router frontend (Jest, jsdom)
    language: TypeScript
    framework: Next.js 14 App Router
    test_command: npm test
    typecheck_command: npm run type-check
    lint_command: npm run lint
    format_check_command: npm run format:check
    format_fix_command: npm run format
    snapshot_reset_command: npm run test:update-snapshots
    test_file_pattern: "*.test.ts / *.test.tsx or __tests__/ folders"
    path_alias: "@ -> project root"
    coverage_target: "90%"
    notes: >
      TDD required. Update Storybook for new/changed components. Never expose sensitive data to client. Use 'use client' directive only when genuinely required.


  # ── Add new types here as your business grows ──
  #
  # migration-module:
  #   language: TypeScript
  #   framework: Node.js
  #   test_command: npm test
  #   typecheck_command: npm run typecheck
  #   lint_command: npm run lint
  #   format_check_command: npm run prettier:check
  #   format_fix_command: npm run prettier:write
  #
  # python-service:
  #   language: Python
  #   framework: FastAPI
  #   test_command: pytest
  #   typecheck_command: mypy src/
  #   lint_command: ruff check .
  #   format_check_command: ruff format --check .
  #   format_fix_command: ruff format .

# ── Repos ─────────────────────────────────────────────────────────────────────
# Each entry needs: type, local_path, github_url, main_branch
# All other settings are inherited from repo_types above.
# Add per-repo overrides below any repo if needed.

repos:
  # ── Example repos — replace with your own ──────────────────────────────────
  my-backend:
    type: sdk-module
    local_path: /path/to/your/backend-module
    github_url: https://github.com/your-org/backend-module.git
    main_branch: main

  my-frontend:
    type: nextjs-portal
    local_path: /path/to/your/frontend-app
    github_url: https://github.com/your-org/frontend-app.git
    main_branch: main

  # ── Add more repos here ────────────────────────────────────────────────────

# ── Your Personal Preferences ─────────────────────────────────────────────────
# Injected into every task regardless of repo. Edit freely.

personal_context: |
  Developer: Your Name
  Organisation: Your Organisation

  Coding preferences:
  - Use conventional commits: feat:, fix:, refactor:, chore:, docs:, test:
  - Write tests before or alongside implementation
  - Prefer early returns over deeply nested if/else
  - Keep functions small and single-purpose
  - Add JSDoc comments to all exported functions and types
  - No commented-out code in commits
  - Use TypeScript types explicitly — avoid `any`
  - Max line length: 80 characters

  Branch naming:
  - New features  : feature/<short-description>
  - Bug fixes     : fix/<short-description>
  - Use kebab-case: feature/password-reset, fix/quote-rounding-error

  Pull Request style:
  - Title matches the user story title exactly
  - Body lists each acceptance criterion and how it is satisfied
  - Include manual testing steps
  - Keep PRs focused — one feature or fix per PR
